name: backend

on:
  push:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koyala
          POSTGRES_PASSWORD: koyala
          POSTGRES_DB: koyala_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koyala -d koyala_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KOYALA_TEST_DATABASE_URL: postgresql+psycopg://koyala:koyala@localhost:5432/koyala_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Risk evaluation report (not yet a gate; see koyala/evals/data/README.md)
        run: python -m koyala.evals.risk_eval >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t koyala-api:ci backend
      - name: Smoke test (in-memory mode)
        run: |
          docker run -d --name api -p 8000:8000 koyala-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api
          exit 1
